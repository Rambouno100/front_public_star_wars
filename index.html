<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Store</title>
    <link href="./css/style.css" rel="stylesheet">
    <script src="js/nav.js" defer></script>
    <script src="js/footer.js" defer></script>
    <style>
        body {
            background: #0a0a0a;
            color: #e5e5e5;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <header id="main-nav"></header>

    <main class="flex-1">

        <!-- hero -->
        <section class="relative h-[65vh] overflow-hidden bg-neutral-900">
            <video class="w-full h-full object-cover opacity-50" src="assets/hero.mp4" autoplay muted
                playsinline></video>

            <div class="absolute inset-0 flex flex-col items-center justify-center gap-4 text-center px-6">
                <p class="text-xs uppercase tracking-widest text-neutral-400">La galaxia te espera</p>

                <h2 class="text-4xl font-light text-white">Star Wars Store</h2>

                <a href="#catalog"
                    class="border border-neutral-600 px-6 py-3 rounded-full text-xs uppercase tracking-widest text-neutral-400 hover:text-white hover:border-white transition-colors">Explorar
                    colección</a>
            </div>
        </section>

        <!-- catalogo -->
        <section id="catalog" class="max-w-6xl mx-auto w-full px-6 py-16">
            <h2 class="text-xl uppercase tracking-widest text-neutral-500 mb-10 text-center">Galactic Collection</h2>

            <div id="product-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <p class="col-span-full text-xs uppercase tracking-widest text-neutral-600 text-center py-20">
                    Cargando...</p>
            </div>
        </section>

    </main>

    <footer id="main-footer"></footer>

    <script src="js/cart.js"></script>
    <script src="js/api.js"></script>
</body>

</html>
